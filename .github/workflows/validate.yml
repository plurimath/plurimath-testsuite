name: validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The authored expectations under fixtures/ are data only, checked by
  # check-jsonschema pinned in .github/validator/requirements.txt, which
  # validates fixtures/<name>.yaml against schema/<name>.json and rejects
  # duplicate keys while loading. The "plain scalars" step keeps the YAML in
  # the portable subset described in README "Portable YAML".
  fixtures:
    runs-on: ubuntu-latest
    env:
      FIXTURES: >-
        cli-conversions facade-expectations formatter-expectations
        grammar-expectations parser-expectations renderer-expectations
        symbol-renderings unicode-expectations xml-parser-expectations
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --no-deps -r .github/validator/requirements.txt
      - name: Fixture inventory matches the expected list
        run: |
          expected="$(printf '%s.yaml\n' $FIXTURES | sort)"
          actual="$(ls fixtures | sort)"
          if [ "$expected" != "$actual" ]; then
            diff <(echo "$expected") <(echo "$actual")
            exit 1
          fi
      # Every string is double-quoted. Each quoted string becomes a placeholder
      # and comments are removed; what remains may hold only: a `- ` sequence
      # indicator, a `:` key separator right after a quoted string, flow
      # brackets, `, ` separators, and the plain scalars null, true, false and
      # integer or decimal numbers (no exponent). A `---` is allowed on line 1
      # only. See README "Portable YAML" for what this rejects.
      - name: Plain scalars are JSON literals only
        run: |
          # GitHub runs bash with -e and pipefail; this step reads statuses itself.
          set +e +o pipefail
          q=$'\001' # stands in for a double-quoted string; YAML text cannot contain it
          f_='([[:space:]]|[]}]|,([[:space:]]|[]}]|$)|$)'
          lit="(-?(0|[1-9][0-9]*)(\.[0-9]+)?|true|false|null)$f_"
          ok="^([[:space:]]+|-([[:space:]]|$)|$q(:([[:space:]]|$)|$f_)|$lit|[][{}]|,([[:space:]]|[]}]|$))*\$"
          rc=0
          for name in $FIXTURES; do
            f="fixtures/$name.yaml"
            sed -E "1s/^---[[:space:]]*\$//; s/\"([^\"\\\\]|\\\\.)*\"/$q/g; s/(^|[[:space:]])#.*\$//" "$f" |
              grep -nvE "$ok" | sed "s|^|$f:|"
            status=("${PIPESTATUS[@]}")
            [ "${status[0]}" -eq 0 ] && [ "${status[1]}" -eq 1 ] || rc=1
          done
          exit $rc
      - name: Validate each fixture against its schema
        run: |
          rc=0
          check-jsonschema --check-metaschema schema/*.json || rc=1
          for name in $FIXTURES; do
            check-jsonschema --schemafile "schema/$name.json" "fixtures/$name.yaml" || rc=1
          done
          check-jsonschema --schemafile schema/fixtures-provenance.json provenance/fixtures.yaml || rc=1
          exit $rc

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"

      # No gems: scripts/validate.rb implements the JSON Schema subset the
      # corpus schemas use, and rejects any schema keyword it cannot check.
      # The Gemfile contains development tools only — this step runs
      # before `bundle install` on purpose, and must keep passing with no
      # bundle installed.
      #
      # A run that finds no corpus files fails, so an empty tree can never be
      # mistaken for a passing one. If this ever lands on a branch without
      # corpus/, add --allow-empty until the data arrives — and remove it in
      # the commit that adds corpus/.
      - run: ruby scripts/validate.rb

      # The spec suite guards the validator itself (and the generator's
      # gem-free helpers).
      - run: bundle install
      - run: bundle exec rspec

  validate-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
      - run: ruby scripts/validate.rb
