name: validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The authored expectations under fixtures/ are data only. They are checked
  # by check-jsonschema (pinned in .github/validator/requirements.txt) against
  # schema/<name>.json, and by loading them with two standard YAML loaders
  # that must agree. See README "Portable YAML".
  fixtures:
    runs-on: ubuntu-latest
    env:
      FIXTURES: >-
        cli-conversions facade-expectations formatter-expectations
        grammar-expectations parser-expectations renderer-expectations
        symbol-renderings unicode-expectations xml-parser-expectations
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
      - run: python -m pip install --no-deps -r .github/validator/requirements.txt
      - name: Fixture inventory matches the expected list
        run: |
          expected="$(printf '%s.yaml\n' $FIXTURES | sort)"
          actual="$(ls -A fixtures | sort)"
          if [ "$expected" != "$actual" ]; then
            diff <(echo "$expected") <(echo "$actual")
            exit 1
          fi
      # Conformance across two standard YAML loaders, not a custom parser:
      # Ruby's Psych (safe_load, no aliases) and Python's ruamel.yaml (YAML
      # 1.2, safe) must each load fixtures, corpus and stage data to JSON with string
      # keys, and serialize to identical sorted JSON. A load error, alias,
      # date, NaN/Inf, non-string key, duplicate key, extra document, or any
      # value the two read differently (1e-3, 1:20, 017, yes) fails.
      # Only individually listed historical payloads with matching SHA-256
      # may skip comparison (scripts/portable-yaml-exemptions.json).
      - name: Two YAML loaders read the same values
        run: |
          python scripts/validate-portable-yaml.py fixtures provenance corpus stages generations
      - name: Portable YAML checker regressions
        run: python spec/portable_yaml_test.py
      - name: Validate each fixture against its schema
        run: |
          rc=0
          check-jsonschema --check-metaschema schema/*.json || rc=1
          for name in $FIXTURES; do
            check-jsonschema --schemafile "schema/$name.json" "fixtures/$name.yaml" || rc=1
          done
          check-jsonschema --schemafile schema/fixtures-provenance.json provenance/fixtures.yaml || rc=1
          exit $rc
      - name: Validate sealed evaluation request profiles
        run: python -I scripts/validate-evaluation-profiles.py
      - name: Validate exact historical rejection offset exceptions
        run: |
          ruby scripts/validate-rejection-offsets.rb
          python -I scripts/test-rejection-offsets.py

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"

      # No gems: scripts/validate.rb implements the JSON Schema subset the
      # corpus schemas use, and rejects any schema keyword it cannot check.
      # The Gemfile contains development tools only — this step runs
      # before `bundle install` on purpose, and must keep passing with no
      # bundle installed.
      #
      # A run that finds no corpus files fails, so an empty tree can never be
      # mistaken for a passing one. If this ever lands on a branch without
      # corpus/, add --allow-empty until the data arrives — and remove it in
      # the commit that adds corpus/.
      - run: ruby scripts/validate.rb

      # The spec suite guards the validator itself (and the generator's
      # gem-free helpers).
      - run: bundle install
      - run: bundle exec rspec

  # The immutable stage generations under stages/ and their ledgers under
  # generations/ (docs/stage-corpus-contract.adoc). --base compares with the
  # PR base, or with the previous main commit on a push, so a merged
  # generation or ledger entry can never be edited. The full history is
  # fetched because the base commit must be readable.
  stages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
      - name: Validate stage generations against the base commit
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$BASE_SHA" ] && [ "$BASE_SHA" != "0000000000000000000000000000000000000000" ]; then
            ruby --disable-gems scripts/validate-facade-successors.rb --base "$BASE_SHA"
          else
            ruby --disable-gems scripts/validate-facade-successors.rb
          fi
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            ruby scripts/validate-stages.rb
          else
            ruby scripts/validate-stages.rb --base "$BASE_SHA"
          fi
      # The unicode rows for the 675 external inputs of
      # fixtures/unicode-expectations.yaml, against that fixture
      # (docs/unicode-external-rows.adoc).
      - name: Validate the external UnicodeMath stage rows
        run: ruby --disable-gems scripts/validate-unicode-external.rb
      # A second, independent reading of the stage manifests: the same
      # schemas through check-jsonschema rather than validate.rb's subset.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --no-deps -r .github/validator/requirements.txt
      - name: Stage manifests match their schemas under check-jsonschema
        run: |
          check-jsonschema --schemafile schema/stage-ledger.json generations/*.yaml
          check-jsonschema --schemafile schema/stage-provenance.json stages/*/generations/*/provenance.yaml

  validate-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
      - run: ruby scripts/validate.rb
