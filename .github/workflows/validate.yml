name: validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The authored expectations under fixtures/ are checked with an
  # off-the-shelf JSON Schema validator, so the data needs no code from this
  # repository. Each fixtures/<name>.yaml is validated against
  # schema/<name>.json; a fixture without a schema fails the step.
  fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --no-deps -r .github/validator/requirements.txt
      - name: Validate fixtures against their schemas
        run: |
          set -eu
          for fixture in fixtures/*.yaml; do
            name="$(basename "$fixture" .yaml)"
            check-jsonschema --schemafile "schema/$name.json" "$fixture"
          done

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"

      # No gems: scripts/validate.rb implements the JSON Schema subset the
      # corpus schemas use, and rejects any schema keyword it cannot check.
      # The Gemfile contains development tools only — this step runs
      # before `bundle install` on purpose, and must keep passing with no
      # bundle installed.
      #
      # A run that finds no corpus files fails, so an empty tree can never be
      # mistaken for a passing one. If this ever lands on a branch without
      # corpus/, add --allow-empty until the data arrives — and remove it in
      # the commit that adds corpus/.
      - run: ruby scripts/validate.rb

      # The spec suite guards the validator itself (and the generator's
      # gem-free helpers).
      - run: bundle install
      - run: bundle exec rspec

  validate-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
      - run: ruby scripts/validate.rb
