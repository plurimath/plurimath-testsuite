name: validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The authored expectations under fixtures/ are data only, checked by
  # off-the-shelf tools pinned in .github/validator/requirements.txt:
  # check-jsonschema validates fixtures/<name>.yaml against schema/<name>.json,
  # and yamllint (.yamllint.yaml) rejects duplicate keys, undeclared aliases
  # and YAML 1.1 booleans. README "Portable YAML" lists the rules these
  # tools cannot see.
  fixtures:
    runs-on: ubuntu-latest
    env:
      FIXTURES: >-
        cli-conversions facade-expectations formatter-expectations
        grammar-expectations parser-expectations renderer-expectations
        symbol-renderings unicode-expectations xml-parser-expectations
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --no-deps -r .github/validator/requirements.txt
      - name: Fixture inventory matches the expected list
        run: |
          expected="$(printf '%s.yaml\n' $FIXTURES | sort)"
          actual="$(ls fixtures | sort)"
          if [ "$expected" != "$actual" ]; then
            diff <(echo "$expected") <(echo "$actual")
            exit 1
          fi
      - name: No anchors, aliases, tags, non-finite numbers or timestamps
        run: |
          if grep -nE '^[[:space:]]*(- +)?([^"[:space:]][^:]*|"([^"\\]|\\.)*"): +([&*!]|[-+]?\.(nan|NaN|NAN|inf|Inf|INF)([[:space:]]|$)|[0-9]{4}-[0-9]{2}-[0-9]{2})|^[[:space:]]*- +([&*!]|[-+]?\.(nan|inf)|[0-9]{4}-[0-9]{2}-[0-9]{2})' \
              fixtures/*.yaml provenance/*.yaml; then
            echo "::error::non-portable YAML scalar (see README, Portable YAML)"
            exit 1
          fi
      - run: yamllint --strict -c .yamllint.yaml fixtures provenance
      - name: Validate each fixture against its schema
        run: |
          rc=0
          check-jsonschema --check-metaschema schema/*.json || rc=1
          for name in $FIXTURES; do
            check-jsonschema --schemafile "schema/$name.json" "fixtures/$name.yaml" || rc=1
          done
          check-jsonschema --schemafile schema/fixtures-provenance.json provenance/fixtures.yaml || rc=1
          exit $rc

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"

      # No gems: scripts/validate.rb implements the JSON Schema subset the
      # corpus schemas use, and rejects any schema keyword it cannot check.
      # The Gemfile contains development tools only — this step runs
      # before `bundle install` on purpose, and must keep passing with no
      # bundle installed.
      #
      # A run that finds no corpus files fails, so an empty tree can never be
      # mistaken for a passing one. If this ever lands on a branch without
      # corpus/, add --allow-empty until the data arrives — and remove it in
      # the commit that adds corpus/.
      - run: ruby scripts/validate.rb

      # The spec suite guards the validator itself (and the generator's
      # gem-free helpers).
      - run: bundle install
      - run: bundle exec rspec

  validate-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
      - run: ruby scripts/validate.rb
