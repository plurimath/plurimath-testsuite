# Portable-YAML rules for fixtures/ and provenance/, checked in CI by yamllint.
# Only rules that protect portability are enabled; layout is not linted.
rules:
  anchors:
    forbid-undeclared-aliases: true
    forbid-duplicated-anchors: true
    forbid-unused-anchors: true
  key-duplicates: enable
  truthy:
    allowed-values: ["true", "false"]
    check-keys: true
  document-start: disable
