targets:
- asciimath
- latex
- mathml
- unicodemath
- omml
- html
cases:
- id: number-formatter-de-style-grouping
  input: '123456.789'
  input_format: asciimath
  preprocessed: '123456.789'
  call:
    method: number_formatter
    args:
      locale: en
      options:
        decimal: ","
        group: "."
        group_digits: 3
      precision:
      string_format:
  expected:
    asciimath:
      output: 123.456,789
    latex:
      output: 123.456,789
    mathml:
      output: |
        <math xmlns="http://www.w3.org/1998/Math/MathML" display="block">
          <mstyle displaystyle="true">
            <mn>123.456,789</mn>
          </mstyle>
        </math>
