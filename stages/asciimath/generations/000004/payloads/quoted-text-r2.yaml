# AsciiMath conformance cases: quoted-text-r2 (supersession of text-unitsml-valid/unicodemath).
# Row regenerated by scripts/generate-corpus.rb from plurimath 0a1df68 (0.11.17); only the id
# differs from the generator's text-unitsml-valid row. Provenance lives in ../provenance.yaml.
---
schema: plurimath-corpus/asciimath/1
group: quoted-text-r2
description: 'Revision 2 of one quoted-text expectation that plurimath changed on purpose (plurimath PR #549, merge 2967dcc47a9f37d5b9a2dd13d94a2ad35d4cc256). text-unitsml-valid-r2 supersedes the unicodemath expectation of text-unitsml-valid (\mupkg, plurimath 0.11.12 ed048ee) with \mup"kg"; text-unitsml-valid itself is kept unchanged as the generation 1-3 oracle. Same input, preprocessed text, parse tree, model and other targets as text-unitsml-valid.'
input_format: asciimath
targets:
- asciimath
- latex
- mathml
- unicodemath
- omml
- html
cases:
- id: text-unitsml-valid-r2
  input: '"unitsml(kg)"'
  input_format: asciimath
  preprocessed: '"unitsml(kg)"'
  expected:
    asciimath: rm(kg)
    latex: "\\mathrm{kg}"
    mathml: |
      <math xmlns="http://www.w3.org/1998/Math/MathML" display="block">
        <mstyle displaystyle="true">
          <mrow>
            <mstyle mathvariant="normal">
              <mi>kg</mi>
            </mstyle>
          </mrow>
        </mstyle>
      </math>
    unicodemath: \mup"kg"
    omml: |
      <m:oMathPara xmlns:m="http://schemas.openxmlformats.org/officeDocument/2006/math" xmlns:mc="http://schemas.openxmlformats.org/markup-compatibility/2006" xmlns:mo="http://schemas.microsoft.com/office/mac/office/2008/main" xmlns:mv="urn:schemas-microsoft-com:mac:vml" xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships" xmlns:v="urn:schemas-microsoft-com:vml" xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main" xmlns:w10="urn:schemas-microsoft-com:office:word" xmlns:w14="http://schemas.microsoft.com/office/word/2010/wordml" xmlns:w15="http://schemas.microsoft.com/office/word/2012/wordml" xmlns:wne="http://schemas.microsoft.com/office/word/2006/wordml" xmlns:wp="http://schemas.openxmlformats.org/drawingml/2006/wordprocessingDrawing" xmlns:wp14="http://schemas.microsoft.com/office/word/2010/wordprocessingDrawing" xmlns:wpc="http://schemas.microsoft.com/office/word/2010/wordprocessingCanvas" xmlns:wpg="http://schemas.microsoft.com/office/word/2010/wordprocessingGroup" xmlns:wpi="http://schemas.microsoft.com/office/word/2010/wordprocessingInk" xmlns:wps="http://schemas.microsoft.com/office/word/2010/wordprocessingShape">
        <m:oMath>
          <m:r>
            <m:rPr>
              <m:sty m:val="p"/>
            </m:rPr>
            <m:t>kg</m:t>
          </m:r>
        </m:oMath>
      </m:oMathPara>
    html: kg
  parse_tree:
    expr:
      sequence:
        unitsml: kg
  model:
    class: Math::Formula
    fields:
      displaystyle: true
      input_string: '"unitsml(kg)"'
      left_right_wrapper: true
      value:
      - class: Math::Function::Unitsml
        fields:
          text: kg
