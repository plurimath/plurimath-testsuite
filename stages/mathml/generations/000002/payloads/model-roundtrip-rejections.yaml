# Written by plurimath-testsuite scripts/generate-xml-stage-cases.rb. Do not edit.
---
schema: plurimath-stage/mathml/cases/1
group: model-roundtrip-rejections
description: Mml.parse model and to_xml output for every case of payloads/rejections.yaml,
  ids <id>.model-roundtrip. Each model is its class with the declared attributes that
  are not at their default, in declaration order, plus @element_order where the model
  tracks child order. An input the gem raises on is a refusal with the raising stage
  and exception class.
boundary: model-roundtrip
cases:
- id: mathml-unsupported-pi.model-roundtrip
  input:
    str: "<math xmlns='http://www.w3.org/1998/Math/MathML'><pi/></math>"
  options: {}
  expected:
    model:
      node: Mml::V3::Math
      fields:
      - - pi_value
        - array:
          - node: Mml::V3::Pi
            fields: []
      - - "@element_order"
        - array:
          - hash:
            - - str: type
              - str: Element
            - - str: name
              - str: pi
    output:
      str: |-
        <math xmlns="http://www.w3.org/1998/Math/MathML">
          <pi/>
        </math>
