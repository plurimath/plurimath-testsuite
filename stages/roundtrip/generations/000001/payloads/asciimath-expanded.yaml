schema: plurimath-stage/roundtrip/1
group: asciimath-expanded
description: Expanded uncertainty calls (uexp) with and without a coverage probability,
  read from AsciiMath. Each target is written by Formula#to_<target> and read back
  with Plurimath::Math.parse (with the case's options for AsciiMath and UnicodeMath);
  lossless means the formula read back is == to the one the input parsed to. model,
  where present, is the single Uncertainty node the input parses to.
cases:
- id: asciimath-expanded.k
