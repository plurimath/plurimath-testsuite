        fields:
        - - value
          - str: '2'
        - - mini_sub_sized
          - bool: false
        - - mini_sup_sized
          - bool: false
        - - base
          - nil: true
    - - coverage_probability
      - nil: true
    - - lower
      - nil: true
    - - upper
      - nil: true
    - - interval_kind
      - nil: true
    - - notation
      - nil: true
    - - unit
      - nil: true
  expected:
    asciimath:
      output: uexp(10.0, 0.3, 2)
      lossless: true
    unicode:
      output: ⓘ("expanded-uncertainty(10.0,0.3,2)"(10.0±0.3), k=2)
      lossless: true
