description: 'Inputs the gem refuses, so a port can be checked on what it rejects. Two notes, because the obvious reading of this list is wrong in both places. `latex-tilde` is a divergence candidate rather than a plain refusal: `~` is ordinary LaTeX for a non-breaking space, and the gem refuses it anyway. And two further refusals measured against this oracle are deliberately absent, because this schema cannot express them — the empty input, which `input` forbids by minLength, and `&#x110000;`, a WELL-FORMED hex entity above the Unicode maximum, whose refusal comes from the HTMLEntities round trip inside the preprocessing pass itself, leaving no `preprocessed` text to record. Malformed entities are the opposite case and are ACCEPTED, falling through as literal characters: `&nosuchentity;`, `&#xZZ;`, `&;` and `&pi` all parse.'
