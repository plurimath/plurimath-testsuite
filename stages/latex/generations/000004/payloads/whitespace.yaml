# Generated by scripts/generate-corpus.rb from the Ruby plurimath gem. Do not edit.
# Provenance lives in corpus/provenance.yaml.
---
schema: plurimath-corpus/latex/1
group: whitespace
description: 'Spacing commands, which survive the space-deleting pass. Some cases here record a deferred-construct placeholder rather than a rendering: where the gem has no name for a construct in a target notation, `Math::Symbols::Symbol#parsing_wrapper` emits `"P{name}"` -- the quotes are part of the emitted string -- for asciimath and unicodemath, or `\text{P[name]}` for latex. The corpus records what the gem produced, so the placeholder IS the expectation and a port that renders something better fails the case.'
input_format: latex
targets:
- asciimath
- latex
- mathml
- unicodemath
- omml
- html
cases:
