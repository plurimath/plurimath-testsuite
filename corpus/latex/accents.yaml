schema: plurimath-corpus/latex/1
group: accents
description: 'Accents, which decorate their argument, not fence it. Some cases here record a deferred-construct placeholder rather than a rendering: where the gem has no name for a construct in a target notation, `Math::Symbols::Symbol#parsing_wrapper` emits `P{name}` for asciimath and unicodemath, or `\text{P[name]}` for latex. The corpus records what the gem produced, so the placeholder IS the expectation and a port that renders something better fails the case.'
input_format: latex
targets:
- asciimath
- latex
- mathml
- unicodemath
cases:
- id: latex-accent-hat
  input: "\\hat{a}"
  input_format: latex
  preprocessed: "\\hat{a}"
  expected:
    asciimath: hat(a)
    latex: "\\hat{a}"
    mathml: |
      <math xmlns="http://www.w3.org/1998/Math/MathML" display="block">
        <mstyle displaystyle="true">
          <mover>
            <mi>a</mi>
            <mo>^</mo>
          </mover>
        </mstyle>
      </math>
    unicodemath: "(a)̂"
  parse_tree:
    unary_functions:
      first_value:
        expression:
          symbols: a
      unary: hat
  model:
    class: Math::Formula
    fields:
      displaystyle: true
      input_string: "\\hat{a}"
      left_right_wrapper: true
      value:
      - class: Math::Function::Hat
        fields:
          attributes: {}
          parameter_one:
            class: Math::Symbols::Symbol
            fields:
              value: a
